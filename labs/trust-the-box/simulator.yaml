version: "2.0"

metadata:
  id: trust-the-box
  title: "Trust the Box, Not the Agent"
  summary: >
    Watch a coding agent containerize the Product Catalog on a trusted laptop —
    reading credentials, baking secrets into image layers, and escaping a
    container through the Docker socket — then run the exact same agent inside a
    Docker Sandbox and watch every one of those moves get contained. Fully
    simulated: nothing here touches a real machine, key, or network.

# ---------------------------------------------------------------------------
# State. `mode` is the spine of the whole lab: the agent starts on the HOST
# ("yolo" — same access as the developer), and flips to "sandbox" the moment the
# learner runs `sbx run claude` in Section 6. Several commands have two
# scenarios — a sandbox-gated one FIRST, then the host one — so the same escape
# or secret-read tells a different story on each side of that line.
# ---------------------------------------------------------------------------
state:
  mode: yolo
  agent:
    ran: false
  baseline:
    built: false
  dhi:
    built: false
  stack:
    up: false
  sandbox:
    running: false
  policy:
    npm_allowed: false

# A presenter toggle so you can flip the boundary on and off live, without
# re-running the whole lab. Off = agent on the host (yolo); On = inside a sandbox.
controls:
  - id: sandbox-mode
    label: "Run the agent inside a Docker Sandbox"
    description: "OFF: the agent runs on your laptop with your access. ON: the agent runs inside a microVM behind the proxy."
    state: mode
    enabled: sandbox
    disabled: yolo

# Cosmetic pacing so pulls / builds / scans don't print instantly.
settings:
  pace:
    pull: 700
    build: 900
    start: 500
    scan: 1100
    think: 600

defaults:
  unmatched:
    stderr: ["command not found — this command isn't part of the Trust the Box lab."]
    exit: 1

scenarios:
  # ===========================================================================
  # Warm-up
  # ===========================================================================
  - id: sbx-version
    when:
      command: [sbx]
      args: { 0: { oneOf: [version, --version] } }
    then:
      output:
        - "sbx version 0.41.0 (Docker Sandboxes)"
        - "microVM runtime: ready   proxy: ready"

  - id: docker-version
    when:
      command: [docker, version]
    then:
      output:
        - "Client:  Version 29.7.2"
        - "Server:  Docker Desktop   Engine 29.7.2"

  # ===========================================================================
  # Section 1 — Traditional SDLC (a human-paced history)
  # ===========================================================================
  - id: git-log
    when:
      command: [git, log]
    then:
      output:
        - "a1b2c3d  (HEAD -> main) Add UPC to product-created event   — reviewed by @maria"
        - "9f8e7d6  Fix price rounding on checkout                     — reviewed by @sam"
        - "4c3b2a1  Containerize the service (Dockerfile + compose)    — reviewed by @maria"
        - "7e6d5c4  Initial Product Catalog REST API                   — reviewed by @sam"
        - ""
        - "Every commit paused for a human. Safe — and slow."

  # ===========================================================================
  # Section 2 — Agentic SDLC: hand the goal to an agent
  # ===========================================================================
  - id: agent-run
    completes: run-agent
    when:
      command: [claude]
      args: { 0: { any: true } }
    then:
      state: { agent.ran: true }
      output:
        - "● I'll containerize the Product Catalog and get it running. Plan:"
        - { text: "  1. Read the project config and env files", delay: think }
        - { text: "  2. Write a Dockerfile", delay: think }
        - { text: "  3. Build the image", delay: think }
        - { text: "  4. Bring the stack up with Compose", delay: think }
        - { text: "  5. Verify the API responds", delay: think }
        - ""
        - "● Running — no approvals, no pauses. Plan → Act → Observe → Repeat."
        - "  (hundreds of tool calls, none of which you will see)"

  # ===========================================================================
  # Section 3 — The agent containerizes the Product Catalog
  # ===========================================================================
  - id: docker-build-baseline
    completes: build-image
    when:
      command: [docker, build]
      args: { -t: { oneOf: [catalog-service:baseline, catalog-service, .] } }
    then:
      state: { baseline.built: true }
      output:
        - { text: "[+] Building 54.2s (10/10) FINISHED", delay: build }
        - " => [internal] load build definition from Dockerfile"
        - " => => FROM docker.io/library/node:20"
        - { text: " => [2/5] WORKDIR /usr/src/app", delay: short }
        - { text: " => [3/5] COPY package*.json ./", delay: short }
        - { text: " => [4/5] RUN npm install --production      (431 packages)", delay: build }
        - { text: " => [5/5] COPY . .                          (includes .env — see Section 4)", delay: short }
        - " => exporting to image   sha256:3af1c9e0b2d4   1.1GB"
        - ""
        - "Built catalog-service:baseline. It works. We'll look at what's inside it shortly."

  - id: compose-up
    when:
      command: [docker, compose]
      args: { 0: { oneOf: [up] } }
    then:
      state: { stack.up: true }
      output:
        - { text: " ✔ Network catalog_default   Created", delay: short }
        - { text: " ✔ Container postgres        Started", delay: start }
        - { text: " ✔ Container kafka           Started", delay: start }
        - { text: " ✔ Container localstack      Started", delay: start }
        - { text: " ✔ Container wiremock        Started", delay: start }
        - { text: " ✔ Container backend         Started", delay: start }
        - { text: " ✔ Container frontend        Started", delay: start }
        - ""
        - "API:  http://localhost:3000/api/products      Web:  http://localhost:5173"

  # ===========================================================================
  # Section 4 — The leak: product keys and credentials
  # (`cat .env` and `cat .sbxenv.yaml` use the built-in reader on the seed files)
  # ===========================================================================

  # Host AWS credentials — reachable ONLY when the agent runs on the host.
  - id: aws-creds-sandbox
    when:
      command: [cat]
      args: { 0: { oneOf: ["/root/.aws/credentials", "~/.aws/credentials"] } }
      state: { mode: sandbox }
    then:
      output:
        - "cat: /root/.aws/credentials: No such file or directory"
        - "(the host's ~/.aws is not mounted into the sandbox)"

  - id: aws-creds-yolo
    completes: see-the-leak
    when:
      command: [cat]
      args: { 0: { oneOf: ["/root/.aws/credentials", "~/.aws/credentials"] } }
    then:
      output:
        - "[default]"
        - "aws_access_key_id = AKIAIOSFODNN7EXAMPLE"
        - "aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
        - "region = us-east-1"
        - ""
        - "These are your PRODUCTION keys — nothing to do with this project. The agent"
        - "can read every credential on your laptop, because it IS you."

  # Secrets baked into the image layers.
  - id: docker-history
    when:
      command: [docker, history]
      args: { 0: { any: true } }
    then:
      output:
        - "IMAGE          CREATED         CREATED BY                                      SIZE"
        - "3af1c9e0b2d4   1 minute ago   CMD [\"node\" \"src/index.js\"]                      0B"
        - "<missing>      1 minute ago   COPY . . # buildkit  (includes .env)             412kB"
        - "<missing>      1 minute ago   RUN npm install --production                      298MB"
        - "<missing>      2 weeks ago    /bin/sh -c #(nop) FROM node:20                    1.1GB"
        - ""
        - "The `COPY . .` layer pulled .env — with STRIPE_SECRET_KEY and the product"
        - "license key — straight into the image. `docker save` it and the secrets travel."

  # Other projects on the laptop.
  - id: ls-projects-sandbox
    when:
      command: [ls]
      args: { 0: { oneOf: ["/home/dev/projects", "~/projects"] } }
      state: { mode: sandbox }
    then:
      output: ["ls: /home/dev/projects: No such file or directory"]

  - id: ls-projects-yolo
    when:
      command: [ls]
      args: { 0: { oneOf: ["/home/dev/projects", "~/projects"] } }
    then:
      output:
        - "acme-payments/   customer-pii-export/   internal-admin/   product-catalog/"
        - "(every other repo on the laptop — all readable by the agent)"

  # ===========================================================================
  # Section 5 — Why not containers? The Docker-socket escape.
  # A `docker run` that mounts the socket. Sandbox-gated scenario FIRST so it
  # wins once the boundary is up; the host version is the fall-through.
  # ===========================================================================
  - id: socket-escape-sandbox
    completes: contain-escape
    when:
      command: [docker, run]
      state: { mode: sandbox }
    then:
      output:
        - { text: "Reaching the Docker socket...", delay: short }
        - "CONTAINER ID   IMAGE     COMMAND       STATUS     NAMES"
        - "(only this sandbox's own engine answers — it has nothing else running)"
        - ""
        - "Same command, same socket. But the socket belongs to the sandbox's OWN"
        - "Docker engine, not your host. There is no host here to escape to."

  - id: socket-escape-yolo
    completes: escape-host
    when:
      command: [docker, run]
    then:
      output:
        - { text: "Reaching the Docker socket at /var/run/docker.sock...", delay: short }
        - "CONTAINER ID   IMAGE                 COMMAND                  NAMES"
        - "e3a1b2c3d4e5   acme-payments:prod    \"node server.js\"         payments-api"
        - "f6g7h8i9j0k1   postgres:16           \"postgres\"               prod-db"
        - "a2b3c4d5e6f7   internal-admin:latest \"/admin\"                 admin-console"
        - ""
        - "⚠  Those are HOST containers. Mounting the socket handed the agent the host's"
        - "   Docker engine — it can now start a privileged container and own the machine."

  # ===========================================================================
  # Section 6 — Hello, Sandboxes: start the box, flip the boundary to ON.
  # ===========================================================================
  - id: sbx-run
    completes: start-sandbox
    when:
      command: [sbx, run]
    then:
      state: { mode: sandbox, sandbox.running: true }
      output:
        - { text: "Creating sandbox 'claude-product-catalog'...", delay: short }
        - { text: "  ✔ microVM booted      (its own kernel, filesystem, Docker engine)", delay: start }
        - { text: "  ✔ network proxy up    (the only way out — every request checked)", delay: start }
        - { text: "  ✔ workspace mounted   (./product-catalog — and only that)", delay: short }
        - { text: "  ✔ credentials armed   (injected by the proxy; never enter the VM)", delay: short }
        - ""
        - "● Claude Code is running inside the box. Same agent, same goal — new blast radius."
        - "  Try the moves from Sections 4 and 5 again now."

  # ===========================================================================
  # Section 7 — Contain: host keys gone, API keys injected.
  # ===========================================================================
  - id: ls-ssh-sandbox
    when:
      command: [ls]
      args: { 0: { oneOf: ["/root/.ssh", "~/.ssh"] } }
      state: { mode: sandbox }
    then:
      output: ["(empty — the host's ~/.ssh was never mounted into the sandbox)"]

  - id: ls-ssh-yolo
    when:
      command: [ls]
      args: { 0: { oneOf: ["/root/.ssh", "~/.ssh"] } }
    then:
      output:
        - "id_ed25519   id_ed25519.pub   known_hosts   config"
        - "(the agent can read — and exfiltrate — your private keys)"

  - id: curl-model-api
    when:
      command: [curl]
      args: { 0: { any: true } }
    then:
      output:
        - "> POST /v1/messages HTTP/2"
        - "> host: api.anthropic.com"
        - "> authorization: (none)        ← the request leaves the sandbox with NO key"
        - ""
        - "   proxy: destination allowed → injecting credential from the host keychain"
        - ""
        - "< HTTP/2 200"
        - '< {"id":"msg_01...","role":"assistant","content":[{"type":"text","text":"ok"}]}'
        - ""
        - "200 OK. The agent got the answer; the raw key never entered the box."

  # ===========================================================================
  # Section 8 — Control: the policy log and allow rules.
  # ===========================================================================
  - id: policy-log
    completes: read-policy-log
    when:
      command: [sbx, policy, log]
    then:
      output:
        - "TIME      DESTINATION                       RULE       RESULT"
        - "10:42:01  registry.npmjs.org:443            default    ✔ allow"
        - "10:42:03  index.docker.io:443               default    ✔ allow"
        - "10:42:05  api.anthropic.com:443             default    ✔ allow"
        - "10:42:09  prod-db.acme.internal:5432        —          ✘ DENY"
        - "10:42:09  s3.amazonaws.com:443              —          ✘ DENY"
        - ""
        - "The agent TRIED to reach production Postgres and S3. Balanced policy denied"
        - "both — and logged them. You can see exactly what it reached for."

  - id: policy-allow
    when:
      command: [sbx, policy, allow]
      args: { 1: { any: true } }
    then:
      state: { policy.npm_allowed: true }
      output:
        - "added allow rule: network {{ args.1 }}"
        - "takes effect immediately — no restart."

  - id: policy-ls
    when:
      command: [sbx, policy, ls]
    then:
      output:
        - "PROFILE: balanced  (deny-by-default + common dev endpoints)"
        - "  allow  network  registry.npmjs.org"
        - "  allow  network  *.docker.io"
        - "  allow  network  api.anthropic.com"
        - "  deny   network  *                (everything else)"

  # ===========================================================================
  # Section 9 — Choice: pick the kit, scan, and harden the base image.
  # (`cat .sbxenv.yaml` reads the seed file via the built-in reader)
  # ===========================================================================
  - id: scout-quickview-baseline
    when:
      command: [docker, scout, quickview]
      args: { 0: { oneOf: [catalog-service:baseline] } }
    then:
      output:
        - { text: "    ✓ Indexed 431 packages", delay: scan }
        - "  Target              │  catalog-service:baseline  │   0C    8H    41M    93L"
        - "  Base image  node:20 │  updatable to node:24      │   0C    6H    30M    54L"
        - ""
        - "  8 High CVEs — almost all from the node:20 base and the 431 packages it drags in."

  - id: docker-build-dhi
    completes: harden-image
    when:
      command: [docker, build]
      args: { -f: { oneOf: [Dockerfile.dhi] } }
    then:
      state: { dhi.built: true }
      output:
        - { text: "[+] Building 31.0s (12/12) FINISHED", delay: build }
        - " => FROM dhi.io/node:24-debian13-dev AS build"
        - { text: " => RUN npm ci --production --ignore-scripts", delay: build }
        - " => FROM dhi.io/node:24-debian13   (distroless, non-root, no shell)"
        - { text: " => exporting to image   sha256:9e2b71c4a0f8   248MB", delay: short }
        - ""
        - "Built catalog-service:dhi — a hardened multi-stage image. Scan it:"

  - id: scout-quickview-dhi
    when:
      command: [docker, scout, quickview]
      args: { 0: { oneOf: [catalog-service:dhi] } }
    then:
      output:
        - { text: "    ✓ Indexed 78 packages", delay: scan }
        - "  Target  │  catalog-service:dhi  │   0C    0H    1M    4L"
        - ""
        - "  From 8 High to 0 High. Same app, hardened base — 1.1GB → 248MB."

  # ===========================================================================
  # Section 10 — Capacity: reproduce the sandbox from one committed file.
  # ===========================================================================
  - id: sbx-env-run
    completes: reproduce-env
    when:
      command: [sbx, env, run]
      state: { mode: sandbox }
    then:
      output:
        - "Reading .sbxenv.yaml (committed to the Product Catalog repo)..."
        - { text: "  ✔ agent: claude   kits: node-dev, postgres-client, docker-scout", delay: short }
        - { text: "  ✔ network policy + ports resolved from the file", delay: short }
        - { text: "  ✔ sandbox 'claude-product-catalog' created", delay: start }
        - ""
        - "No README to follow, nothing to install. Every teammate's sandbox is identical"
        - "because it comes from the same file in the repo."

  # A bare `sbx env run` before the sandbox is up (early readers) — still works.
  - id: sbx-env-run-cold
    when:
      command: [sbx, env, run]
    then:
      state: { mode: sandbox, sandbox.running: true }
      output:
        - "Reading .sbxenv.yaml... creating sandbox 'claude-product-catalog'."
        - "Run `sbx run claude` first if you want to follow the lab in order."

  # ===========================================================================
  # Section 11 — Co-ordinate: same env, in the cloud, under governance.
  # ===========================================================================
  - id: sbx-cloud-run
    completes: go-cloud
    when:
      command: [sbx, cloud, run]
    then:
      output:
        - "Submitting .sbxenv.yaml to Docker Cloud..."
        - { text: "  ✔ org policy applied   (central allow/deny, audit on)", delay: short }
        - { text: "  ✔ approved kits only   (node-dev, postgres-client, docker-scout)", delay: short }
        - { text: "  ✔ 8 cloud sandboxes running the Product Catalog in parallel", delay: build }
        - ""
        - "The exact same environment that ran on your laptop now runs remotely — more"
        - "agents than one laptop could hold, every action audited centrally."

  - id: sbx-cloud-ls
    when:
      command: [sbx, cloud, ls]
    then:
      output:
        - "NAME                      LOCATION   STATUS    AUDIT"
        - "catalog-agent-01..08      cloud      running   → org log"
