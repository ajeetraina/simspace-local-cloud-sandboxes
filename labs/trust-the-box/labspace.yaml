title: "Trust the Box, Not the Agent"
description: >
  A coding agent containerizes the Product Catalog service for you — and in the
  process reads your production credentials, bakes secrets into the image, and
  escapes a container through the Docker socket. Then you run the exact same
  agent inside a Docker Sandbox and watch each move get contained. Follow the
  five C's — Contain, Control, Choice, Capacity, Co-ordinate — from laptop to
  cloud. Every command is simulated; nothing touches a real machine or key.

# Landing-page card. `order: 2` puts the hands-on lab after the slides deck.
# labs.json is GENERATED from this block — never edit labs.json by hand.
catalog:
  icon: security
  order: 2
  tags: ["sandboxes", "sbx", "agents", "security", "containers", "sdlc"]
  estimatedMinutes: 60

simulator: simulator.yaml

terminals:
  - id: main
    title: Terminal
    icon: terminal

# ---------------------------------------------------------------------------
# Seed the virtual filesystem with the Product Catalog (dockersamples/
# catalog-service-node). Built-in ls/cat reflect these immediately — the agent's
# `git clone` is cosmetic; the files are already here. The .env is the one we did
# NOT want on the laptop, and Dockerfile.dhi is written by the learner in §9.
# ---------------------------------------------------------------------------
files:
  README.md: |
    # product-catalog  (catalog-service-node)

    A REST API over a PostgreSQL product database, wired to Kafka (events),
    LocalStack (S3 uploads) and WireMock (an upstream pricing API), with a small
    React frontend. Ships a Dockerfile and a compose.yaml.

      backend    src/            Express API (Node.js)
      frontend   frontend/       React SPA (Vite)
      database   db/schema.sql   PostgreSQL schema + seed data

    Run the stack:  docker compose up -d
    API:            http://localhost:3000/api/products
  .env: |
    # Committed to the repo "to make local dev easy" — exactly the file an agent
    # reads first. Everything below is a real secret in a real project.
    DATABASE_URL=postgres://catalog:S3cr3t-pg-pw@prod-db.acme.internal:5432/catalog
    AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
    AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    STRIPE_SECRET_KEY=sk_live_DEMOpropNotARealKey
    PRODUCT_LICENSE_KEY=PK-CATALOG-9F3A-2C71-PAID-TIER-UNLOCK
    JWT_SECRET=super-secret-signing-key-change-me
  .sbxenv.yaml: |
    # The Product Catalog's OWN sandbox environment — committed to this repo so
    # every developer (and every agent) gets the identical box. (Section 10.)
    schemaVersion: "1"
    agent: claude
    workspace: ./product-catalog
    kits:
      - docker.io/dockersamples/node-dev-kit:latest
      - docker.io/dockersamples/postgres-client-kit:latest
      - docker.io/dockersamples/docker-scout-kit:latest
    network:
      profile: balanced
    sandboxOptions:
      cpus: 4
      memory: 8g
  package.json: |
    {
      "name": "catalog-service-node",
      "version": "1.0.0",
      "main": "src/index.js",
      "scripts": {
        "start": "node src/index.js",
        "test": "vitest run"
      },
      "dependencies": {
        "express": "^4.19.2",
        "pg": "^8.11.5",
        "kafkajs": "^2.2.4",
        "@aws-sdk/client-s3": "^3.588.0",
        "axios": "^1.7.2"
      }
    }
  Dockerfile: |
    # The image the agent writes by default. It works — but FROM node:20 pulls in
    # a whole OS and 431 packages (and their CVEs), and `COPY . .` bakes in .env.
    FROM node:20

    WORKDIR /usr/src/app
    COPY package*.json ./
    RUN npm install --production
    COPY . .

    EXPOSE 3000
    CMD ["node", "src/index.js"]
  compose.yaml: |
    services:
      backend:
        build: .
        ports: ["3000:3000"]
        env_file: .env
        depends_on: [postgres, kafka, localstack, wiremock]
      frontend:
        build: ./frontend
        ports: ["5173:5173"]
      postgres:
        image: postgres:16
        environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: catalog }
      kafka:
        image: confluentinc/cp-kafka:7.6.0
      localstack:
        image: localstack/localstack:3
        environment: { SERVICES: s3 }
      wiremock:
        image: wiremock/wiremock:3.5.4
  src/index.js: |
    const express = require("express");
    const products = require("./routes/products");
    const app = express();
    app.use(express.json());
    app.use("/api/products", products);
    app.listen(3000, () => console.log("catalog-service listening on :3000"));
  src/routes/products.js: |
    const { Router } = require("express");
    const ProductService = require("../services/ProductService");
    const router = Router();
    router.get("/", async (_req, res) => res.json(await ProductService.getProducts()));
    router.get("/:id", async (req, res) => {
      const product = await ProductService.getProductById(req.params.id);
      if (!product) return res.status(404).json({ error: "not found" });
      res.json(product);
    });
    module.exports = router;
  db/schema.sql: |
    CREATE TABLE IF NOT EXISTS products (
      id    SERIAL PRIMARY KEY,
      name  TEXT NOT NULL,
      sku   TEXT UNIQUE NOT NULL,
      price NUMERIC(10, 2) NOT NULL DEFAULT 0
    );
    INSERT INTO products (name, sku, price) VALUES
      ('Widget', 'WGT-001', 9.99),
      ('Gadget', 'GDG-002', 19.99)
    ON CONFLICT (sku) DO NOTHING;

