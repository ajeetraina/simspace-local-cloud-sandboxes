title: "Harden the Box"
description: >
  One sandbox, end to end. Take the Product Catalog service and box its agent the
  whole way: spin the sandbox up locally and in the cloud (launch.sh), add a
  network policy, pin the filesystem, author a Cedar authorization policy, lock the
  MCP surface, read the audit log, then capture the lot in an sbxenv.yaml so the
  whole team gets the identical box. Real sbx commands, fully simulated - nothing to
  install.

# Landing-page card. Only shown when the repo has two or more labs. labs.json is
# GENERATED from this block - never edit labs.json by hand. order: 7 places this
# end-to-end walkthrough after the four Cs (2-5) and Coordinate (6).
catalog:
  icon: lock
  order: 7
  description: "Box the Product Catalog agent end to end - local and cloud: policy, filesystem, Cedar, MCP, audit, sbxenv.yaml"
  tags: ["sandbox", "sbx", "policy", "cedar", "mcp", "audit", "sbxenv", "product-catalog"]
  estimatedMinutes: 30

# Command behaviour lives in simulator.yaml (relative to this file).
simulator: simulator.yaml

# One terminal, one virtual machine and filesystem.
terminals:
  - id: main
    title: Terminal
    icon: terminal

# Seed the virtual filesystem with the Product Catalog sample app - the same
# catalog-service-node used across the other labs. Built-in `ls`/`cat` reflect
# these immediately; scenarios create authz.cedar and sbxenv.yaml on top.
files:
  README.md: |
    # catalog-service-node

    Product Catalog service: a REST API over a PostgreSQL product database, wired to
    Kafka (events), LocalStack (S3 uploads) and WireMock (an upstream pricing API),
    with a small React frontend.

    Layout:
      backend    src/            Express API (Node.js)
      frontend   frontend/       React SPA (Vite)
      database   db/schema.sql   PostgreSQL schema + seed data

    Run locally:  npm install && npm start   (needs Postgres, Kafka, LocalStack, WireMock)
    API:          http://localhost:3000/api/products

    In this lab you hand this project to a boxed agent and harden the box around it,
    one control at a time.
  package.json: |
    {
      "name": "catalog-service-node",
      "version": "1.0.0",
      "description": "Product Catalog REST API over Postgres, with Kafka, LocalStack (S3) and WireMock",
      "main": "src/index.js",
      "scripts": {
        "start": "node src/index.js",
        "dev": "nodemon src/index.js",
        "test": "vitest run"
      },
      "dependencies": {
        "express": "^4.19.2",
        "pg": "^8.11.5",
        "kafkajs": "^2.2.4",
        "@aws-sdk/client-s3": "^3.588.0",
        "axios": "^1.7.2",
        "dotenv": "^16.4.5",
        "pino": "^9.1.0"
      },
      "devDependencies": {
        "nodemon": "^3.1.0",
        "vitest": "^1.6.0"
      }
    }
  src/index.js: |
    const express = require("express");
    const products = require("./routes/products");

    const app = express();
    app.use(express.json());
    app.use("/api/products", products);

    app.listen(3000, () => console.log("catalog-service listening on :3000"));
  src/routes/products.js: |
    const { Router } = require("express");
    const { pool } = require("../db/pool");
    const axios = require("axios");

    const upstream = process.env.CATALOG_UPSTREAM || "http://wiremock:8080";
    const router = Router();

    router.get("/", async (_req, res) => {
      const { rows } = await pool.query("SELECT * FROM products ORDER BY id");
      res.json(rows);
    });

    module.exports = router;
  db/schema.sql: |
    CREATE TABLE IF NOT EXISTS products (
      id    SERIAL PRIMARY KEY,
      name  TEXT NOT NULL,
      sku   TEXT UNIQUE NOT NULL,
      price NUMERIC(10, 2) NOT NULL DEFAULT 0
    );

    INSERT INTO products (name, sku, price) VALUES
      ('Widget', 'WGT-001', 9.99),
      ('Gadget', 'GDG-002', 19.99)
    ON CONFLICT (sku) DO NOTHING;
  # A developer's .env - the app reads secrets from the environment, nothing is
  # hardcoded. These are exactly the values the sandbox must keep away from the
  # agent: the proxy brokers them, the box never holds the raw value.
  .env: |
    POSTGRES_HOST=db.internal.acme.corp
    POSTGRES_PASSWORD=pg_S3cr3t_9f2b!
    AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
    AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    S3_BUCKET=acme-product-images
  frontend/src/App.jsx: |
    import { useEffect, useState } from "react";

    export default function App() {
      const [products, setProducts] = useState([]);
      useEffect(() => {
        fetch("/api/products").then((r) => r.json()).then(setProducts);
      }, []);
      return (
        <main>
          <h1>Product Catalog</h1>
          <ul>
            {products.map((p) => (
              <li key={p.id}>{p.name} - ${p.price}</li>
            ))}
          </ul>
        </main>
      );
    }
  # Cedar authorization policy for the boxed agent (Section 4). Three rules:
  # permit workspace shell + writes, permit static-MCP tool calls, forbid reads
  # of anything that looks like a secret. `sbx policy authz set authz.cedar`
  # loads it; `sbx policy authz test <resource>` checks a single action.
  authz.cedar: |
    // authz.cedar - Cedar authorization for the boxed agent.
    // Checked on every shell command, file write, and MCP tool call.

    // 1. The agent may run shell commands and write files, but only inside
    //    the mounted workspace.
    permit(
      principal,
      action in [Action::"Shell", Action::"File::write"],
      resource in Folder::"Workspace"
    );

    // 2. The agent may call tools - but only on the MCP server pinned at boot.
    permit(
      principal,
      action == Action::"Mcp::call",
      resource in Server::"StaticMcp"
    );

    // 3. Never let the agent read secrets, even inside the workspace.
    //    Matches .env, *.pem, id_* - deny beats any permit above.
    forbid(
      principal,
      action == Action::"File::read",
      resource in Set::"Secrets"
    );
  # sbxenv.yaml (Section 7) - every control from this lab, declared once so the
  # whole team reproduces the identical hardened box with `sbx env run`.
  sbxenv.yaml: |
    schemaVersion: "1"
    name: catalog
    agent: claude
    workspace: .

    # Section 2 - network policy travels with the env.
    policy:
      network:
        allow: [registry.npmjs.org, "*.pypi.org", files.pythonhosted.org]
        deny:  [evil.example.com]
      # Section 4 - the Cedar authorization policy, by path.
      authz: authz.cedar

    # Section 5 - the MCP surface, pinned at boot and authorized centrally.
    mcp:
      static: [catalog-tools]

    # Brokered secret: a SOURCE, not a value. Resolved on each developer's own
    # host via 1Password, injected by the proxy, never committed.
    secrets:
      dhi-mcp-pat:
        ref: "op://Engineering/DockerHub/pat"
        snapshot: true

