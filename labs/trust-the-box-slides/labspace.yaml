# The conference deck for "Trust the Box, Not the Agent". Same labspace.yaml
# format as a lab, with `kind: slides`. It reuses the SIBLING LAB's simulator, so
# the live demos on these slides run the exact commands learners run in the lab —
# the two can't drift apart.
kind: slides
title: "Trust the Box, Not the Agent — Slides"
description: >
  Sandboxing coding agents from laptop to cloud. The talk: the agentic SDLC, a
  coding agent containerizing the Product Catalog (and leaking credentials and
  escaping its container along the way), then the five C's of Docker Sandboxes —
  Contain, Control, Choice, Capacity, Co-ordinate. Watch the talk, then do the lab.

# Landing-page card. `order: 1` puts the deck ahead of the lab: watch the talk,
# then do the lab. labs.json is GENERATED from this block — never edit it by hand.
catalog:
  icon: slideshow
  order: 1
  tags: ["sandboxes", "agents", "security", "slides", "start here"]
  estimatedMinutes: 35

version: "1.0.0"

# Dark is the opener/divider surface; content slides set `theme: light` per-slide
# (or via the layout default). See §9 of the slidedeck spec.
theme: dark

brand:
  eyebrow: "Trust the Box, Not the Agent"
  source: "DOCKER SANDBOXES · LAPTOP TO CLOUD"

# Reuse the SIBLING LAB's simulator so any spliced-in demo runs the exact scripted
# commands learners run themselves. State is NOT shared — this deck gets its own
# fresh machine.
simulator: ../trust-the-box/simulator.yaml

# One demo terminal. The lab's scenarios aren't terminal-scoped, so `demo` fires
# them; it's the conventional deck id referenced by `::terminal{id=demo}`.
terminals:
  - id: demo
    title: Demo
    icon: terminal

# `slides:` is the deck alias for `sections:`. Each chapter is one markdown file;
# slides within it are split on lines of exactly `---`.
slides:
  - title: Opening
    contentPath: 00-opening.md
  - title: The SDLC changed
    contentPath: 01-sdlc.md
  - title: The leak
    contentPath: 02-leak.md
  - title: Hello Sandboxes
    contentPath: 03-sandboxes.md
  - title: Contain
    contentPath: 04-contain.md
  - title: Control
    contentPath: 05-control.md
  - title: Choice
    contentPath: 06-choice.md
  - title: Capacity
    contentPath: 07-capacity.md
  - title: Co-ordinate
    contentPath: 08-coordinate.md
  - title: Recap
    contentPath: 09-recap.md

variables:
  app: "Product Catalog"
  docs: "docs.docker.com/ai/sandboxes"
  repo: "github.com/dockersamples/catalog-service-node"
