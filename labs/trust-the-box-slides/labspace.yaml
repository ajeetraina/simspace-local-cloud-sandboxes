# "Trust the box, not the agent" — the talk deck, image-driven from the New
# Docker Theme PowerPoint: 56 full-bleed slides (assets/slide-01..56.webp) with
# the presenter's speaker notes carried across. Live "Demo time!" slides mark
# where the presenter switches to a terminal. Pairs with the hands-on labs
# (Contain → Coordinate).
kind: slides
title: "Trust the box, not the agent"
description: >
  One coding agent, one real job — only the box around it changes. The agentic
  workflow turns one prompt into a bigger blast radius on the Product Catalog,
  then the four C's of Docker Sandboxes — Contain, Control, Choice, Capacity —
  close it, each with a live demo. Watch the talk, then do the labs.

catalog:
  icon: slideshow
  order: 1
  tags: ["sandboxes", "sbx", "agents", "security", "4cs", "slides", "start here"]
  estimatedMinutes: 40

version: "1.0.0"

# Dark is the deck's default surface — content slides set theme per-slide.
theme: dark

brand:
  eyebrow: "Trust the box, not the agent"
  source: "DOCKER SANDBOXES · SBX"

slides:
  - title: Talk
    contentPath: deck.md

variables:
  app: "Product Catalog"
  repo: "github.com/dockersamples/catalog-service-node"
  site: "sandboxing.dockerworkshop.com"
